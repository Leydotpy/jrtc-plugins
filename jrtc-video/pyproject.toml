[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jrtc-video"
version = "3.0.1"
description = "Typed VideoRoom plugin client and lifecycle service for jrtc"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Janus API contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "jrtc>=3.1,<4",
  "pydantic>=2.7,<3",
  "logvista==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "build>=1.2"]

[project.entry-points."jrtc.plugins"]
videoroom = "jrtc_video:VideoRoomPlugin"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jrtc_room = ["py.typed"]

[tool.ruff]
target-version = "py312"
