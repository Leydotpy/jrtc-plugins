[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "janus-stream-orchestrator"
version = "0.1.0"
description = "Pluggable bridge between stream-orchestrator and jrtc-stream"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.14"
authors = [{ name = "S.A" }]
dependencies = [
  "stream-orchestrator>=0.1.0,<0.2",
  "jrtc-stream>=0.2.0,<0.3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2"]
dev = ["janus-stream-orchestrator[test]", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/janus_stream_orchestrator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
