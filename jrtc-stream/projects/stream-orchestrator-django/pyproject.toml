[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stream-orchestrator-django"
version = "0.1.0"
description = "Django persistence and application integration for stream-orchestrator"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "S.A" }]
dependencies = [
  "stream-orchestrator>=0.1.0,<0.2",
  "Django>=6.1,<7",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.25,<2"]
dev = ["stream-orchestrator-django[test]", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stream_orchestrator_django"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/stream_orchestrator_django/models.py" = ["RUF012"]
"src/stream_orchestrator_django/migrations/*.py" = ["RUF012"]
