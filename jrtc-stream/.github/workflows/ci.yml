name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  full-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv
      - name: Sync workspace
        run: uv sync --all-packages --group dev
      - name: Verify
        run: uv run make verify

  portable-packages:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install portable packages and tests
        run: |
          python -m pip install --disable-pip-version-check \
            pytest pytest-asyncio \
            -e projects/stream-orchestrator \
            -e projects/stream-orchestrator-process \
            -e projects/stream-orchestrator-ffmpeg \
            -e projects/stream-orchestrator-gstreamer \
            -e projects/stream-orchestrator-srs \
            -e projects/stream-orchestrator-django \
            -e projects/stream-orchestrator-qt
      - name: Test portable packages
        run: python scripts/run_tests.py --portable
