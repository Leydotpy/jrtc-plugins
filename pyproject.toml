[project]
name = "jrtc-plugins-workspace"
version = "0.0.0"
description = "Development workspace for independently installable Janus named plugins"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["jrtc-*"]
exclude = ["jrtc-stream"]

[dependency-groups]
dev = [
  "build>=1.2,<2,!=1.5.1",
  "jrtc",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
  "twine>=7,<8",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM", "RUF"]
# Public async plugin APIs intentionally expose per-operation timeout controls.
ignore = ["ASYNC109", "E501"]
